# Configuration Spark commune à tous les jobs du projet.

# Mode local : Spark tourne dans un seul conteneur, avec 2 cœurs et 1 Go pour le driver.
spark.master                                        local[2]
spark.driver.memory                                 1g
spark.sql.session.timeZone                          UTC
spark.ui.showConsoleProgress                        false

# Iceberg : active les commandes SQL Iceberg (MERGE, time travel, procédures...)
spark.sql.extensions                                org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# Catalogue "lakehouse" : catalogue REST pour la liste des tables, MinIO pour les fichiers.
spark.sql.defaultCatalog                            lakehouse
spark.sql.catalog.lakehouse                         org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.type                    rest
spark.sql.catalog.lakehouse.uri                     http://iceberg-rest:8181
spark.sql.catalog.lakehouse.warehouse               s3://lakehouse/
# ResolvingFileIO choisit le client selon le chemin : S3FileIO pour s3://, Hadoop pour file:/
# (nécessaire car la lecture en streaming d'une table Iceberg écrit dans le checkpoint local)
spark.sql.catalog.lakehouse.io-impl                 org.apache.iceberg.io.ResolvingFileIO
spark.sql.catalog.lakehouse.s3.endpoint             http://minio:9000
spark.sql.catalog.lakehouse.s3.path-style-access    true
