[project]
name = "cnc-lakehouse"
version = "0.1.0"
description = "Plateforme lakehouse temps réel pour un atelier CNC simulé"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_simulator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
